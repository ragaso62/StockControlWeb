<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos | StockControl</title>
</head>
<body>
    <!--CABEÇALHO-->
    <header class="cabecalho">
        <div class="container cabecalho-conteudo">
            <a href="index.html">
                StockControl
            </a>
            <nav aria-label="Menu princiapl">
                <ul class="menu">
                    <li>   
                        <a href="index.html">Inicio</a>
                    </li>
                    <li>
                        <a href="produtos.html" aria-current="page">Produtos</a>
                    </li>
                    <li>
                        <a href="cadastro.html">Cadastro</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <!--CONTEUDO PRINCIPAL-->
    <main>
        <!--TITULO DA PAGINA-->
        <section class="titulo-pagina">
            <div class="container">
                <h1>
                    Produtos cadastrados
                </h1>
                <p>
                    Confira alguns produtos disponives em nosso exemplo de controle de estoque.
                </p>
            </div>
        </section>
        <!--LISTA DE PRODUTOS-->
        <section class="secao_produtos">
            <div class="container">
                <div class="card-produtos">
                    <!--PRIMEIRO CARD-->
                    <article class="card-produto">
                        <!--IMAGEM ILUSTRATIVA-->
                            <img src="#" alt="descrição da imagem">
                            <div class="card-conteudo">
                                <span class="categoria">
                                    Informatica
                                </span>
                                <h2>
                                    Mouse sem fio
                                </h2>
                                <p>
                                    Mouse óptico sem fio com conexão USB.
                                    Ideal para uso diario
                                </p>
                                <p class="preco">
                                    R$ 242,99
                                </p>
                                <p class="quantidade">
                                    quantidade: 25 unidades
                                </p>
                                <span class="status status-disponivel">
                                    Em estoque
                                </span>
                            </div>
                    </article>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
